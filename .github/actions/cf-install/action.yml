name: Install CF CLI
description: Installs the Cloud Foundry CLI
runs:
  using: "composite"
  steps:
    - name: Download and install cf CLI
      shell: bash
      env:
        CF_CLI_VERSION: 8.19.0
      run: |
        curl -fsSL "https://github.com/cloudfoundry/cli/releases/download/v${CF_CLI_VERSION}/cf8-cli_${CF_CLI_VERSION}_linux_x86-64.tgz" \
          | sudo tar -xz -C /usr/local/bin cf8
        sudo ln -sf /usr/local/bin/cf8 /usr/local/bin/cf
        cf --version